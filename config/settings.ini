; ~/.config/voice-assistant/settings.ini
;
; Пути к моделям можно писать тремя способами:
;   encoder=sub/model.onnx           -> относительно ~/.voice_models
;   encoder=~/models/sub/model.onnx  -> относительно home
;   encoder=/opt/models/model.onnx   -> абсолютный
;
; Смена модели = одна строка [asr] active=... plus setActiveAsrProfileName()
; и пересоздание VoicePipeline (модели грузятся в initialize(), ~1-2 с).

[asr]
active=zipformer-ru
profiles=zipformer-ru,gigaam-v3,gigaam-v3-ctc,whisper-base
num_threads=2
; три уровня бустинга подсказок (формат sherpa-onnx: "фраза :скор").
; Слишком высокий скор начинает вставлять служебные слова туда, где их не говорили.
hotwords_score=2.0               ; слова из user_hotwords.txt
commands_hotwords_score=2.0      ; фразы команд ("удали слово", "режим правки", ...)
punctuation_hotwords_score=2.0   ; диктантные знаки ("точка", "запятая", ...)
; Замер на живой записи: при 1.0/1.25/1.5 модель теряет «точку», при 1.75 и выше — нет.
; Фантомных вставок знаков на речи без диктантных слов при 2.0 не наблюдается.
; Опускать ниже 1.75 не стоит; поднимать выше 2.5 — риск обратного эффекта.

; ---------------------------------------------------------------------------
; ОСНОВНОЙ. Русский transducer, 110 МБ, RTF 0.06 (2 потока, серверный CPU).
; Единственный профиль, где проверены hotwords обычными словами.
; ---------------------------------------------------------------------------
[asr_zipformer-ru]
engine=transducer
encoder=sherpa-onnx-small-zipformer-ru-2024-09-18/encoder.int8.onnx
decoder=sherpa-onnx-small-zipformer-ru-2024-09-18/decoder.int8.onnx
joiner=sherpa-onnx-small-zipformer-ru-2024-09-18/joiner.int8.onnx
tokens=sherpa-onnx-small-zipformer-ru-2024-09-18/tokens.txt
; словарь для hotwords словами; создаётся так:
;   python3 tools/gen_bpe_vocab.py <каталог модели>/bpe.model <каталог модели>/bpe.vocab
bpe_vocab=sherpa-onnx-small-zipformer-ru-2024-09-18/bpe.vocab
modeling_unit=bpe
decoding_method=modified_beam_search
max_active_paths=4
num_threads=2

; ---------------------------------------------------------------------------
; ЗАПАСНОЙ для тяжёлого аудио (шум, голосовые сообщения, атипичная речь).
; GigaAM v3 RNN-T, MIT, 167 МБ. В ~5 раз медленнее zipformer-ru.
; Токены посимвольные (34 шт.), поэтому bpe_vocab не нужен.
; ---------------------------------------------------------------------------
[asr_gigaam-v3]
engine=transducer
encoder=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/encoder.int8.onnx
decoder=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/decoder.onnx
joiner=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/joiner.onnx
tokens=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/tokens.txt
decoding_method=greedy_search
num_threads=2

; ---------------------------------------------------------------------------
; GigaAM v3 CTC, MIT, 163 МБ. Чуть быстрее RNN-T, но hotwords не поддерживает.
; ---------------------------------------------------------------------------
[asr_gigaam-v3-ctc]
engine=nemo-ctc
model=sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/model.int8.onnx
tokens=sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/tokens.txt
num_threads=2

; ---------------------------------------------------------------------------
; Запасной мультиязычный. Единственный, кто сам ставит пунктуацию и заглавные
; и нормализует числа ("October 3, 2026"), зато русский у него заметно хуже
; и он самый медленный (RTF 0.51). Держим на случай диктовки на английском.
; ---------------------------------------------------------------------------
[asr_whisper-base]
engine=whisper
encoder=sherpa-onnx-whisper-base/base-encoder.int8.onnx
decoder=sherpa-onnx-whisper-base/base-decoder.int8.onnx
tokens=sherpa-onnx-whisper-base/base-tokens.txt
language=ru
num_threads=2

[vad]
model=silero_vad.onnx
threshold=0.5
min_silence_duration=0.5
min_speech_duration=0.25
window_size=512
num_threads=1
buffer_seconds=60

[text]
; заглавная в начале предложения и точка в конце (граница сегмента VAD = граница предложения)
auto_punctuate=true
; "точка" -> ".", "запятая" -> ",", "вопросительный знак" -> "?" и т.д.
voice_punctuation=true
; auto_punctuate — общий выключатель. Отдельными ключами можно оставить
; заглавные, но убрать точку в конце (диктовка отдельных слов, поиск, пароли).
capitalize=true
add_final_dot=true

[output]
; как вставлять текст:
;   auto      - через буфер обмена (xclip/xsel/wl-copy) + Ctrl+V, если они есть,
;               иначе xdotool type. Рекомендуется: кириллица не зависит от раскладки.
;   xdotool   - всегда xdotool type --file -  (медленно, требует РУС раскладки!)
;   clipboard - всегда буфер обмена + Ctrl+V
method=auto
; задержка между символами для xdotool type, мс (для clipboard не используется)
typing_delay_ms=12
; VAD отдаёт речь отдельными фразами, каждая вставляется своим вызовом.
; true = добавлять пробел между ними, иначе получается "…назад.Сегодня вот…"
space_between_segments=true
; вставка через буфер затирает его содержимое. true = запомнить прежний ТЕКСТ
; и вернуть обратно через clipboard_restore_ms (картинки и прочие mime не сохраняются)
preserve_clipboard=true
clipboard_restore_ms=1000
; Вставлять в окно, которое было активным В НАЧАЛЕ записи, а не в то, что
; в фокусе сейчас. Без этого результат уходит туда, где оказался фокус через
; 0.5–2 с после фразы: переключился сделать пометку — и продиктованное
; прилетело в заметки.
; ВНИМАНИЕ: xdotool --window доставляет события через XSendEvent, и часть
; приложений их игнорирует. Проверьте на своём редакторе; если ввод не проходит,
; выключите и используйте заметки в файл (см. [notes]) — они от фокуса не
; зависят вообще.
pin_window=false

[commands]
; выполнять ли команды правки ("удали слово", "новая строка") в режиме диктовки.
; false = в диктовке работают только команды смены режима, а продиктованное
; "удали слово" попадает в текст как есть. true = команды правки работают везде.
editing_in_dictation=false
; свой файл команд, формат "фраза = тип[:аргумент]"; по умолчанию
; ~/.config/voice-assistant/commands.txt
;file=~/.config/voice-assistant/commands.txt

[audio]
; лог RMS/gain по 20 строк в секунду. Полезно при отладке микрофона,
; на слабом CPU лучше держать выключенным.
debug_log=false
; Глушитель микрофона на время печати, мс. 0 = выключен.
; Если диктовать и одновременно печатать, микрофон ловит стук клавиш, VAD
; делает из него сегмент, и в текст вставляется мусор. Пока с последнего
; нажатия клавиши (кроме самого хоткея) прошло меньше typing_guard_ms,
; аудио не уходит в VAD/ASR.
; Работает только при [hotkey] backend=evdev: события клавиш берутся оттуда.
; Минус: если говорить и печать одновременно, речь режется — поэтому по
; умолчанию выключено. Запись в WAV (проверка микрофона) не прерывается.
; По окончании записи в лог пишется, сколько аудио было выброшено.
typing_guard_ms=0

[spellcheck]
; режим проверки правописания (Mode::Spellcheck). Движок — hunspell.
enabled=true
; имя словаря: ищутся <lang>.aff и <lang>.dic
lang=ru_RU
; каталог словаря; пусто = /usr/share/hunspell, /usr/share/myspell,
;          /usr/local/share/hunspell, ~/.hunspell, ~/.local/share/hunspell
;dictionary_dir=
; сколько вариантов исправления предлагать
max_suggestions=5

; --- проверка микрофона: запись тракта в WAV -------------------------------
; Записанное можно прогнать офлайн всеми профилями:
;   ./tools/vad-asr-test запись.wav --config ~/.config/voice-assistant/settings.ini
; Каталог по умолчанию: ~/.local/share/voice-assistant/recordings
;mic_check_dir=~/voice-assistant-recordings
; что писать: agc = то же, что уходит в ASR (после усиления); raw = сырой микрофон
mic_check_source=agc
mic_check_prefix=mic-check

; --- заметки: вторая цель вывода -------------------------------------------
; Диктовка в активное окно мешает печатать руками: результат приходит через
; 0.5–2 с после фразы и уходит в то окно, которое в фокусе СЕЙЧАС, а способ
; «буфер обмена + Ctrl+V» ещё и затирает буфер обмена.
;
; Заметки пишутся в файл: ни фокус, ни клавиатура, ни буфер не участвуют,
; поэтому пометки к файлу, с которым работаешь, можно диктовать, продолжая
; печатать. Переключение цели:
;   голосом  — «заметка» / «в редактор» (работает и в режиме диктовки);
;   из трея  — пункт «Писать в файл заметок»;
;   по D-Bus — org.voiceassistant.App.setOutputTarget string:notes
;   в консоли— ./src/voice-assistant --note "текст"
[notes]
enabled=true
; каталог ежедневных файлов заметок; "~" раскрывается, относительный путь
; считается от домашнего каталога. Пусто = ~/.local/share/voice-assistant/notes
;dir=~/.local/share/voice-assistant/notes
; явный файл ВМЕСТО ежедневного (например, ~/work/notes.md). Пусто = по дням.
;file=
; метка времени в начале строки; пусто = писать текст как есть
timestamp=HH:mm:ss
; true = файл .md и строки вида "- 14:03:22 — текст", false = .txt без маркеров
markdown=true
; заголовок "# Заметки YYYY-MM-DD" при создании файла дня
day_header=true
; голосовые команды переключения цели. Слово «заметка» встречается в обычной
; речи: если мешает — выключите, цель останется доступной из трея и по D-Bus.
voice_commands=true
; с какой целью запускаться: focus (активное окно) или notes
start_target=focus

[hotkey]
; Глобальный хоткей микрофона через evdev: работает в X11, Wayland и TTY.
; Нужны права на /dev/input:  sudo usermod -aG input $USER  (и перелогин).
; backend=off — хоткей выключен, остаются трей и D-Bus.
backend=evdev
; F8, KEY_F13, ctrl+space, или числовой код (66 = KEY_F8).
; evdev только СЛУШАЕТ события, поэтому клавиша дойдёт и до активного
; приложения. Возьмите ту, которой никто не пользуется: F13–F24, Scroll Lock,
; Pause, Mic Mute, правый Ctrl или комбинацию (ctrl+alt+f8).
; Блокировать ради этого клавиатуру не нужно и нельзя: печатать во время
; диктовки должно быть можно всегда.
key=KEY_F8
; push_to_talk — держим клавишу, пока говорим (по отпусканию — flush и стоп)
; toggle       — нажал/отжал
mode=push_to_talk
; true = EVIOCGRAB, эксклюзивный перехват ВСЕХ клавиш устройства.
; Опасно для основной клавиатуры (X-сервер перестанет получать ввод)!
; Имеет смысл только для выделенной педали или второй клавиатуры, и даже
; тогда устройство лучше назвать явно в grab_devices.
; Дополнительный предохранитель: при grab=true и пустом grab_devices
; устройства, похожие на полноценную клавиатуру (есть буквы и цифры),
; НЕ перехватываются — в лог пишется, почему.
grab=false
; какие устройства разрешено перехватывать эксклюзивно: подстрока имени или
; путь, через запятую. Примеры: footswitch, /dev/input/event7, "USB Keyboard".
; Пусто = см. предохранитель выше. Список устройств показывает --check.
;grab_devices=/dev/input/event9
