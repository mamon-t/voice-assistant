; ~/.config/voice-assistant/settings.ini
;
; Пути к моделям можно писать тремя способами:
;   encoder=sub/model.onnx           -> относительно ~/.voice_models
;   encoder=~/models/sub/model.onnx  -> относительно home
;   encoder=/opt/models/model.onnx   -> абсолютный
;
; Смена модели = одна строка [asr] active=... plus setActiveAsrProfileName()
; и пересоздание VoicePipeline (модели грузятся в initialize(), ~1-2 с).

[asr]
active=zipformer-ru
profiles=zipformer-ru,gigaam-v3,gigaam-v3-ctc,whisper-base
num_threads=2
hotwords_score=2.0

; ---------------------------------------------------------------------------
; ОСНОВНОЙ. Русский transducer, 110 МБ, RTF 0.06 (2 потока, серверный CPU).
; Единственный профиль, где проверены hotwords обычными словами.
; ---------------------------------------------------------------------------
[asr_zipformer-ru]
engine=transducer
encoder=sherpa-onnx-small-zipformer-ru-2024-09-18/encoder.int8.onnx
decoder=sherpa-onnx-small-zipformer-ru-2024-09-18/decoder.int8.onnx
joiner=sherpa-onnx-small-zipformer-ru-2024-09-18/joiner.int8.onnx
tokens=sherpa-onnx-small-zipformer-ru-2024-09-18/tokens.txt
; словарь для hotwords словами; создаётся так:
;   python3 tools/gen_bpe_vocab.py <каталог модели>/bpe.model <каталог модели>/bpe.vocab
bpe_vocab=sherpa-onnx-small-zipformer-ru-2024-09-18/bpe.vocab
modeling_unit=bpe
decoding_method=modified_beam_search
max_active_paths=4
num_threads=2

; ---------------------------------------------------------------------------
; ЗАПАСНОЙ для тяжёлого аудио (шум, голосовые сообщения, атипичная речь).
; GigaAM v3 RNN-T, MIT, 167 МБ. В ~5 раз медленнее zipformer-ru.
; Токены посимвольные (34 шт.), поэтому bpe_vocab не нужен.
; ---------------------------------------------------------------------------
[asr_gigaam-v3]
engine=transducer
encoder=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/encoder.int8.onnx
decoder=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/decoder.onnx
joiner=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/joiner.onnx
tokens=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/tokens.txt
decoding_method=greedy_search
num_threads=2

; ---------------------------------------------------------------------------
; GigaAM v3 CTC, MIT, 163 МБ. Чуть быстрее RNN-T, но hotwords не поддерживает.
; ---------------------------------------------------------------------------
[asr_gigaam-v3-ctc]
engine=nemo-ctc
model=sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/model.int8.onnx
tokens=sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/tokens.txt
num_threads=2

; ---------------------------------------------------------------------------
; Запасной мультиязычный. Единственный, кто сам ставит пунктуацию и заглавные
; и нормализует числа ("October 3, 2026"), зато русский у него заметно хуже
; и он самый медленный (RTF 0.51). Держим на случай диктовки на английском.
; ---------------------------------------------------------------------------
[asr_whisper-base]
engine=whisper
encoder=sherpa-onnx-whisper-base/base-encoder.int8.onnx
decoder=sherpa-onnx-whisper-base/base-decoder.int8.onnx
tokens=sherpa-onnx-whisper-base/base-tokens.txt
language=ru
num_threads=2

[vad]
model=silero_vad.onnx
threshold=0.5
min_silence_duration=0.5
min_speech_duration=0.25
window_size=512
num_threads=1
buffer_seconds=60

[text]
; заглавная в начале предложения и точка в конце (граница сегмента VAD = граница предложения)
auto_punctuate=true
; "точка" -> ".", "запятая" -> ",", "вопросительный знак" -> "?" и т.д.
voice_punctuation=true
