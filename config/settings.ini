; ~/.config/voice-assistant/settings.ini
;
; Пути к моделям можно писать тремя способами:
;   encoder=sub/model.onnx           -> относительно ~/.voice_models
;   encoder=~/models/sub/model.onnx  -> относительно home
;   encoder=/opt/models/model.onnx   -> абсолютный
;
; Смена модели = одна строка [asr] active=... plus setActiveAsrProfileName()
; и пересоздание VoicePipeline (модели грузятся в initialize(), ~1-2 с).

[asr]
active=zipformer-ru
profiles=zipformer-ru,gigaam-v3,gigaam-v3-ctc,whisper-base
num_threads=2
; три уровня бустинга подсказок (формат sherpa-onnx: "фраза :скор").
; Слишком высокий скор начинает вставлять служебные слова туда, где их не говорили.
hotwords_score=2.0               ; слова из user_hotwords.txt
commands_hotwords_score=2.0      ; фразы команд ("удали слово", "режим правки", ...)
punctuation_hotwords_score=2.0   ; диктантные знаки ("точка", "запятая", ...)
; Замер на живой записи: при 1.0/1.25/1.5 модель теряет «точку», при 1.75 и выше — нет.
; Фантомных вставок знаков на речи без диктантных слов при 2.0 не наблюдается.
; Опускать ниже 1.75 не стоит; поднимать выше 2.5 — риск обратного эффекта.

; ---------------------------------------------------------------------------
; ОСНОВНОЙ. Русский transducer, 110 МБ, RTF 0.06 (2 потока, серверный CPU).
; Единственный профиль, где проверены hotwords обычными словами.
; ---------------------------------------------------------------------------
[asr_zipformer-ru]
engine=transducer
encoder=sherpa-onnx-small-zipformer-ru-2024-09-18/encoder.int8.onnx
decoder=sherpa-onnx-small-zipformer-ru-2024-09-18/decoder.int8.onnx
joiner=sherpa-onnx-small-zipformer-ru-2024-09-18/joiner.int8.onnx
tokens=sherpa-onnx-small-zipformer-ru-2024-09-18/tokens.txt
; словарь для hotwords словами; создаётся так:
;   python3 tools/gen_bpe_vocab.py <каталог модели>/bpe.model <каталог модели>/bpe.vocab
bpe_vocab=sherpa-onnx-small-zipformer-ru-2024-09-18/bpe.vocab
modeling_unit=bpe
decoding_method=modified_beam_search
max_active_paths=4
num_threads=2

; ---------------------------------------------------------------------------
; ЗАПАСНОЙ для тяжёлого аудио (шум, голосовые сообщения, атипичная речь).
; GigaAM v3 RNN-T, MIT, 167 МБ. В ~5 раз медленнее zipformer-ru.
; Токены посимвольные (34 шт.), поэтому bpe_vocab не нужен.
; ---------------------------------------------------------------------------
[asr_gigaam-v3]
engine=transducer
encoder=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/encoder.int8.onnx
decoder=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/decoder.onnx
joiner=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/joiner.onnx
tokens=sherpa-onnx-nemo-transducer-giga-am-v3-russian-2025-12-16/tokens.txt
decoding_method=greedy_search
num_threads=2

; ---------------------------------------------------------------------------
; GigaAM v3 CTC, MIT, 163 МБ. Чуть быстрее RNN-T, но hotwords не поддерживает.
; ---------------------------------------------------------------------------
[asr_gigaam-v3-ctc]
engine=nemo-ctc
model=sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/model.int8.onnx
tokens=sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16/tokens.txt
num_threads=2

; ---------------------------------------------------------------------------
; Запасной мультиязычный. Единственный, кто сам ставит пунктуацию и заглавные
; и нормализует числа ("October 3, 2026"), зато русский у него заметно хуже
; и он самый медленный (RTF 0.51). Держим на случай диктовки на английском.
; ---------------------------------------------------------------------------
[asr_whisper-base]
engine=whisper
encoder=sherpa-onnx-whisper-base/base-encoder.int8.onnx
decoder=sherpa-onnx-whisper-base/base-decoder.int8.onnx
tokens=sherpa-onnx-whisper-base/base-tokens.txt
language=ru
num_threads=2

[vad]
model=silero_vad.onnx
threshold=0.5
min_silence_duration=0.5
min_speech_duration=0.25
window_size=512
num_threads=1
buffer_seconds=60

[text]
; заглавная в начале предложения и точка в конце (граница сегмента VAD = граница предложения)
auto_punctuate=true
; "точка" -> ".", "запятая" -> ",", "вопросительный знак" -> "?" и т.д.
voice_punctuation=true

[output]
; как вставлять текст:
;   auto      - через буфер обмена (xclip/xsel/wl-copy) + Ctrl+V, если они есть,
;               иначе xdotool type. Рекомендуется: кириллица не зависит от раскладки.
;   xdotool   - всегда xdotool type --file -  (медленно, требует РУС раскладки!)
;   clipboard - всегда буфер обмена + Ctrl+V
method=auto
; задержка между символами для xdotool type, мс (для clipboard не используется)
typing_delay_ms=12
; VAD отдаёт речь отдельными фразами, каждая вставляется своим вызовом.
; true = добавлять пробел между ними, иначе получается "…назад.Сегодня вот…"
space_between_segments=true
; вставка через буфер затирает его содержимое. true = запомнить прежний ТЕКСТ
; и вернуть обратно через clipboard_restore_ms (картинки и прочие mime не сохраняются)
preserve_clipboard=true
clipboard_restore_ms=1000

[commands]
; выполнять ли команды правки ("удали слово", "новая строка") в режиме диктовки.
; false = в диктовке работают только команды смены режима, а продиктованное
; "удали слово" попадает в текст как есть. true = команды правки работают везде.
editing_in_dictation=false
; свой файл команд, формат "фраза = тип[:аргумент]"; по умолчанию
; ~/.config/voice-assistant/commands.txt
;file=~/.config/voice-assistant/commands.txt

[audio]
; лог RMS/gain по 20 строк в секунду. Полезно при отладке микрофона,
; на слабом CPU лучше держать выключенным.
debug_log=false

[spellcheck]
; режим проверки правописания (Mode::Spellcheck). Движок — hunspell.
enabled=true
; имя словаря: ищутся <lang>.aff и <lang>.dic
lang=ru_RU
; каталог словаря; пусто = /usr/share/hunspell, /usr/share/myspell,
;          /usr/local/share/hunspell, ~/.hunspell, ~/.local/share/hunspell
;dictionary_dir=
; сколько вариантов исправления предлагать
max_suggestions=5
